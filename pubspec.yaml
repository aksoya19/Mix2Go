name: udp_audio_mix2go
description: "Mix2Go – Receive and play back Opus-encoded DAW audio over UDP."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  udp: ^5.0.3
  flutter_pcm_sound: ^3.3.3
  opus_flutter: ^3.0.3
  opus_dart: ^3.0.1
  ffi: ^2.1.0
  audio_service: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/mix2go_icon.png"
  adaptive_icon_background: "#0E0E16"
  adaptive_icon_foreground: "assets/branding/mix2go_icon_rounded.png"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/branding/mix2go_icon.png"
  windows:
    generate: true
    image_path: "assets/branding/mix2go_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
